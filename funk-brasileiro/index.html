<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Funk Brasileiro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:2rem;margin-bottom:6px;text-align:center}
.sub{color:#aaa;margin-bottom:28px;text-align:center}
.btn{display:inline-block;background:#1db954;color:#000;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:1rem}
.btn:hover{background:#1ed760}
.back{color:#aaa;text-decoration:none;margin-bottom:auto;align-self:flex-start}
.back:hover{color:#fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;width:100%;max-width:960px}
.card{background:#1c1c1c;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.card a.title{color:#fff;text-decoration:none;font-size:1.3rem;font-weight:700}
.card a.title:hover{color:#1db954}
.card .btn{padding:10px 20px;font-size:.9rem}
footer{color:#555;font-size:.8rem;margin-top:32px}
</style>
</head>
<body>
<a class="back" href="../">← voltar pra coleção</a>
<div class="center">
  <h1>Mix Funk Brasileiro</h1>
  <p class="sub">Clique pra ouvir a playlist no Spotify</p>
  <a class="btn" href="https://open.spotify.com/playlist/37i9dQZF1EQoXa13YOCJfF" target="_blank" rel="noopener">Abrir no Spotify</a>
</div>
</body>
</html>
