<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07020f">
<title>Mix MPB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Outfit:wght@300;500&display=swap');
:root{--roxo:#a855f7;--roxo-claro:#d8b4fe;--rosa:#f0abfc;--fundo:#07020f;--card:rgba(35,12,60,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;color:#f5f0ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 18px;
  background:
    radial-gradient(circle at 20% 15%,rgba(168,85,247,.35),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(236,72,153,.22),transparent 45%),
    radial-gradient(circle at 50% 110%,rgba(99,102,241,.25),transparent 50%),
    linear-gradient(180deg,#07020f 0%,#12052a 100%);
  background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 80%,#e9d5ff,transparent),radial-gradient(1.5px 1.5px at 60% 40%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#f5d0fe,transparent),radial-gradient(1px 1px at 70% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 60%,#ddd6fe,transparent),radial-gradient(1px 1px at 92% 55%,#fff,transparent),radial-gradient(1px 1px at 5% 60%,#fae8ff,transparent);
  opacity:.7}
body>*{position:relative;z-index:1}
h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:2.2rem;letter-spacing:.12em;text-align:center;text-transform:uppercase;
  background:linear-gradient(90deg,var(--roxo-claro),var(--rosa),var(--roxo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(168,85,247,.55))}
.sub{color:#c4b5fd;opacity:.8;margin:10px 0 36px;text-align:center;font-weight:300;letter-spacing:.04em}
.btn{display:inline-block;text-decoration:none;color:#fff;font-weight:500;padding:13px 26px;border-radius:999px;font-size:.95rem;
  background:linear-gradient(135deg,#7c3aed,#c026d3);box-shadow:0 0 22px rgba(168,85,247,.55),inset 0 0 12px rgba(255,255,255,.15);
  transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 34px rgba(192,38,211,.8)}
.back{color:#c4b5fd;text-decoration:none;align-self:flex-start;font-size:.95rem;opacity:.85}
.back:hover{color:#fff;opacity:1}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;width:100%;max-width:980px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(192,132,252,.25);border-radius:22px;
  padding:28px 22px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 0 24px rgba(168,85,247,.08);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(232,121,249,.6);box-shadow:0 12px 40px rgba(168,85,247,.35)}
.card a.title{font-family:'Orbitron',sans-serif;color:#f5f0ff;text-decoration:none;font-size:1.05rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.card a.title:hover{color:var(--rosa)}
.card .btn{padding:10px 20px;font-size:.85rem}
</style>
</head>
<body>
<a class="back" href="../">← voltar pra coleção</a>
<div class="center">
  <h1>Mix MPB</h1>
  <p class="sub">clique pra ouvir a playlist no Spotify</p>
  <a class="btn" href="https://open.spotify.com/playlist/37i9dQZF1EQrjpWhpIezMF" target="_blank" rel="noopener">Abrir no Spotify</a>
</div>
</body>
</html>
